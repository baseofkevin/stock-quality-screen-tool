<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2933;--muted:#66727f;--line:#e3e8ee;--blue:#1f5f8b;--green:#1f7a4d;--red:#b3261e;--amber:#9a6700;--soft:#f7f9fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px}.hero{background:linear-gradient(135deg,#123b56,#1f5f8b);color:#fff;border-radius:14px;padding:26px 30px;margin-bottom:20px}
.hero h1{margin:0 0 6px;font-size:28px;letter-spacing:.5px}.hero .sub{opacity:.86}.hero .price{font-size:24px;font-weight:700;margin-top:12px}.hero .meta{opacity:.8;font-size:13px;margin-top:4px}
.badge{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}.buy{background:#e6f4ec;color:var(--green)}.watch_price,.expensive,.watch{background:#fff4df;color:var(--amber)}.avoid{background:#fdecea;color:var(--red)}.unknown{background:#eef1f4;color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin:16px 0;box-shadow:0 1px 2px rgba(20,40,60,.03)}
h2{font-size:20px;margin:0 0 14px;padding-bottom:9px;border-bottom:2px solid #eef1f4}h3{font-size:15px;margin:20px 0 9px;color:#334e63}
p{margin:8px 0}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.mono{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:13px}th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left}th{background:var(--soft);color:#40566a;font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}
.status{font-weight:700;font-size:12px;white-space:nowrap}.status.hit{color:var(--red)}.status.clear{color:var(--green)}.status.unknown{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:10px 0}.metric{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:13px 14px}.metric .k{font-size:12px;color:var(--muted)}.metric .v{font-size:21px;font-weight:700;margin-top:3px}.metric .note{font-size:12px;color:var(--muted);margin-top:2px}
.scorebar{height:9px;background:#e9eef3;border-radius:99px;overflow:hidden;margin:9px 0 2px}.scorebar>i{display:block;height:100%;background:linear-gradient(90deg,#4a90b8,#1f5f8b)}.scorebar.good>i{background:linear-gradient(90deg,#5aa77c,#1f7a4d)}.scorebar.bad>i{background:linear-gradient(90deg,#d88b84,#b3261e)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:13px}.kv .k{color:var(--muted)}
ul{margin:7px 0 7px 20px;padding:0}li{margin:4px 0}.flags{background:#fff8e8;border:1px solid #f0dfb5;border-radius:10px;padding:10px 14px;margin:10px 0}.flags li{color:#6b4c00}
.foot{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.8}.foot b{color:#425466}
.chart{margin:10px 0}.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:#e8edf2;stroke-width:1}.chart .axis{stroke:#c9d3dd;stroke-width:1}
.chart .band{fill:#eef1f4}.chart .tick{fill:#66727f;font-size:10px}
.chart .latest-line{stroke:#9aa7b4;stroke-width:1;stroke-dasharray:3 3}
.chart .latest{font-size:11px;font-weight:700}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin:4px 0 6px;font-size:12px;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
.chart-grid{display:grid;gap:10px;margin:8px 0}.chart-panel h4{margin:6px 0 2px;font-size:13px;color:#334e63}
@media (max-width:640px){.wrap{padding:14px 10px 36px}.hero{padding:20px}.hero h1{font-size:23px}section{padding:17px 14px}table{font-size:12px}th,td{padding:6px 5px}.kv{grid-template-columns:105px 1fr}}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.hero{border-radius:0}section{break-inside:avoid;box-shadow:none}.badge{border:1px solid currentColor}}
</style>
</head>
<body>
<div class="wrap">
{{CONTENT}}
<div class="foot">
  <p><b>方法说明</b> {{METHOD}}</p>
  <p><b>数据来源</b> {{SOURCES}}</p>
  <p><b>口径与边界</b> {{LIMITS}}</p>
  <p>{{DISCLAIMER}}</p>
</div>
</div>
</body>
</html>
